# nav2_params.yaml — JetAuto holonômico, espaços fechados
#
# CALIBRAÇÃO FÍSICA (do URDF):
#   wheelAccel = 5 rad/s², wheel_radius = 0.049 m
#   → a_linear_max = 5 × 0.049 = 0.245 m/s²  (aceleração e frenagem reais)
#   → distância de frenagem a 0.18 m/s = 0.18² / (2 × 0.245) = 0.066 m
#
# PROBLEMA ANTERIOR:
#   MPPI usava ax_min = -2.5 m/s² → planejava trajetórias assumindo parar em 6 mm
#   O robô real precisa de 66 mm → passava perto de paredes que não conseguia evitar
#
# CORREÇÃO:
#   ax_max/ax_min = ±0.25 m/s² (ligeiramente acima do real para margem numérica)
#   velocity_smoother max_accel/decel = ±0.25 m/s² (alinhado com o plugin)
#   O MPPI agora planeja trajetórias fisicamente possíveis

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
    transform_tolerance: 0.5

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0   # aumentado: com a_max=0.245 m/s² o robô
                                       # acelera devagar — não confundir lentidão
                                       # com falta de progresso

    general_goal_checker:
      stateful: false
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.0001
      yaw_goal_tolerance: 3.14        # holonômico — orientação final irrelevante

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56                  # horizonte = 56 × 0.05 = 2.8s
                                       # a 0.18 m/s o robô percorre 0.50 m
                                       # neste horizonte — suficiente para ver
                                       # paredes com antecedência
      model_dt: 0.05
      batch_size: 2000
      ax_max:  0.75                   # ← FÍSICO: wheelAccel×r = 5×0.049 = 0.245
      ax_min: -0.75                   # ← FÍSICO: o MPPI agora planeja trajetórias
                                       # que o robô consegue de facto executar
      ay_max:  0.25                   # idem para movimento lateral (holonômico)
      az_max:  1.0                    # rotação: limitado separadamente
      vx_std: 0.1                    # ruído menor: trajetórias mais conservadoras
      vy_std: 0.1                    #   perto de paredes
      wz_std: 0.4
      vx_max: 0.6
      vx_min: 0.0                     # sem ré
      vy_max: 0.4
      wz_max: 1.5
      iteration_count: 2
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3                # conservador: o MPPI prefere trajetórias
                                       # próximas ao ótimo em vez de explorar
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic"]
      # PathAngleCritic e PreferForwardCritic removidos (robô diferencial only)

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.4

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        critical_cost: 150.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.22
      transform_tolerance: 0.5
      update_frequency: 30.0
      publish_frequency: 15.0
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.45
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /jetauto/lidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          inf_is_valid: true
      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /jetauto/lidar/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          inf_is_valid: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.36
        inflate_unknown: false
      always_send_full_costmap: false

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    save_map_timeout: 5.0

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      cost_travel_multiplier: 1.5
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 0.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0           # alinhado com az_max do MPPI

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:      [ 0.75,  0.5,  1.5]
    min_velocity:      [ 0.0,  -0.5, -1.5]
    max_accel:         [ 1.5,  1.5,  1.0]  # ← FÍSICO: alinhado com wheelAccel
    max_decel:         [-1.5, -1.5, -1.0]  # ← FÍSICO: o smoother não comanda
                                               #   desaceleração mais rápida do que
                                               #   o plugin consegue executar
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
