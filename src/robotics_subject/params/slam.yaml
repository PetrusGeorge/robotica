slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /jetauto/lidar/scan
    use_map_saver: true
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.5
    resolution: 0.05
    restamp_tf: true
    min_laser_range: 0.05
    max_laser_range: 10.0          # labirinto tem ~12m — leituras além disso são de
                                   # corredor não visitado e confundem o matcher
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # ── Quando adicionar um novo scan ────────────────────────────────────────
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.15
    check_min_dist_and_heading_precisely: true

    # ── Buffer de scans ───────────────────────────────────────────────────────
    scan_buffer_size: 10           # buffer enxuto — menos candidatos = menos chance
                                   # de encontrar uma "coincidência" com corredor similar
    scan_buffer_maximum_scan_distance: 8.0   # só usa scans próximos para matching local

    # ── Qualidade do scan matching local ─────────────────────────────────────
    # O problema real: corredores do labirinto são quase idênticos ao LiDAR.
    # O matcher local precisa ser EXIGENTE para não "pular" de um corredor para outro.
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.45   # alto — só aceita match se a sobreposição
                                             # de scans for realmente boa (labirinto tem
                                             # features repetitivas; threshold baixo
                                             # causa "pular" entre corredores similares)
    link_scan_maximum_distance: 1.5          # conecta apenas scans de ±1.5m
                                             # (impede que scan de corredor A seja
                                             # associado ao corredor B paralelo)

    # ── Loop closure — O PRINCIPAL CULPADO ───────────────────────────────────
    #
    # Em labirintos, loop closure é perigoso por design:
    #   - Todos os corredores têm a mesma "assinatura" LiDAR (paredes dos dois lados)
    #   - O toolbox encontra "matches" entre corredores que nunca foram visitados
    #     juntos, fecha um loop falso, e deforma o mapa inteiro de uma vez
    #   - Isso explica o mapa correto no início que se distorce com o tempo:
    #     o primeiro loop closure espúrio acontece quando o robô mapeia corredores
    #     suficientes para que dois deles apareçam no raio de busca
    #
    # Estratégia: desabilitar loop closure completamente.
    # O EKF já fornece odometria filtrada de qualidade; o scan matching local
    # é suficiente para manter consistência em labirintos de tamanho moderado.
    # Loop closure só é útil quando o robô REALMENTE retorna ao ponto de origem
    # após um trajeto longo — neste labirinto isso não acontece de forma previsível.
    do_loop_closing: false

    # Os parâmetros abaixo ficam aqui para referência caso queira reativar
    # loop_search_maximum_distance: 2.0   # se reativar: busca apenas em raio PEQUENO
    # loop_match_minimum_chain_size: 10   # se reativar: exige cadeia longa
    # loop_match_maximum_variance_coarse: 1.5
    # loop_match_minimum_response_coarse: 0.55
    # loop_match_minimum_response_fine: 0.65

    # ── Correlation Parameters ────────────────────────────────────────────────
    correlation_search_space_dimension: 0.3  # era 0.5 — espaço de busca menor
                                             # evita que a correlação encontre
                                             # um corredor vizinho como "melhor match"
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05  # era 0.1 — menos espalhamento
                                                     # = features mais nítidas,
                                                     # menos confusão entre corredores

    # ── Loop Closure Parameters (inativo com do_loop_closing: false) ──────────
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Scan Matcher: penalidades de variância ────────────────────────────────
    distance_variance_penalty: 0.6  # penaliza poses incertas em distância
    angle_variance_penalty: 1.2     # penaliza poses incertas em ângulo
                                    # Valores altos: o matcher prefere "não atualizar"
                                    # a aceitar uma pose ruim — correto para labirinto
                                    # onde um match errado distorce o mapa permanentemente
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: false    # era true — quando o matcher não encontra bom match,
                                     # a expansão de resposta busca em área maior e
                                     # AUMENTA a chance de encontrar corredor similar
                                     # como falso positivo; desabilitar é mais seguro

    # ── Occupancy grid ────────────────────────────────────────────────────────
    min_pass_through: 2
    occupancy_threshold: 0.25
